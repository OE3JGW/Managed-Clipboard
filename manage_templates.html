<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Manage Templates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            user-select: none;
            -webkit-user-select: none;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            max-width: 100px;
            height: auto;
            -webkit-user-drag: none;
            pointer-events: none;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .button-group {
            text-align: center;
            margin-bottom: 20px;
        }
        .button-group button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button-group button:hover {
            background-color: #ddd;
        }
        .drag-handle {
            width: 14px;
            height: 20px;
            margin-right: 8px;
            cursor: grab;
            flex-shrink: 0;
            touch-action: none;
            user-select: none;
            background-image: radial-gradient(#9a9a9a 1.15px, transparent 1.2px);
            background-size: 7px 6.6px;
            background-repeat: repeat;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .group {
            margin-bottom: 18px;
        }
        .group.dragging,
        .template.dragging {
            opacity: 0.45;
            pointer-events: none;
        }
        .group-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid #ccc;
        }
        .group-header strong {
            flex: 1;
            font-size: 17px;
            color: #333;
        }
        .group-items {
            padding-left: 8px;
            min-height: 28px;
        }
        .ungrouped {
            min-height: 24px;
        }
        .template {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.05);
        }
        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .template-content {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            word-break: break-word;
        }
        .template strong {
            flex: 1;
        }
        .template .marker {
            font-size: 12px;
            margin-right: 10px;
        }
        .template .marker.html {
            color: green;
        }
        .template .marker.plain {
            color: darkgray;
        }
        .delete-btn, .edit-btn, .delete-group-btn, .edit-group-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-left: 10px;
        }
        .delete-btn, .delete-group-btn {
            color: red;
        }
        .delete-btn:hover, .delete-group-btn:hover {
            color: darkred;
        }
        .edit-btn, .edit-group-btn {
            color: blue;
        }
        .edit-btn:hover, .edit-group-btn:hover {
            color: darkblue;
        }
        .import-template {
            text-align: center;
            margin-top: 20px;
        }
        .import-template small {
            display: block;
            margin-bottom: 10px;
            color: #555;
        }
        #importFileInput {
            display: none;
        }
        .import-template button {
            margin: 0 4px 10px;
        }
        #importFileName {
            margin-left: 8px;
            color: #555;
            font-size: 14px;
        }
        .security-notice {
            margin: 0 0 20px;
            padding: 12px 14px;
            border: 1px solid #e0c36a;
            border-radius: 5px;
            background: #fff8e1;
            color: #5c4b00;
            font-size: 14px;
            line-height: 1.45;
        }
        .security-notice strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="images/icongross.png" alt="Logo">
    </div>
    <h1>Manage Templates</h1>
    <div class="security-notice" role="note">
        <strong>Do not store secrets in templates.</strong>
        Do not save passwords, credentials, API keys, tokens, certificates, or similar secrets. Templates are stored unencrypted in the browser profile and can be exported as JSON.
    </div>
    <div class="button-group">
        <button id="savePlainTextTemplateBtn">Save from Clipboard as PlainText</button>
        <button id="saveHtmlTemplateBtn">Save from Clipboard as HTML</button>
        <button id="addHeadingBtn">Add Heading</button>
    </div>
    <div class="import-template">
        <small>The file should be named "templates.json".</small>
        <button id="importTemplateBtn">Import Templates</button>
        <button id="exportTemplateBtn">Export Templates</button>
        <input type="file" id="importFileInput" accept=".json">
        <button type="button" id="chooseImportFileBtn">Choose File</button>
        <span id="importFileName">No file selected</span>
    </div>
    <div id="templates"></div>
    <script src="manage_templates.js"></script>
</body>
</html>
